<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Login - Mate.arg</title>
  <link rel="stylesheet" href="../CSS/estilosFormulario.css">
  <link rel="icon" type="image/png" href="IMG/Iconomate.png">
  <link rel="website icon" type="png" href="c:\Users\lucca\Downloads\mate.png">
</head>

<body>
  <section>
    <div class="form-container">
      <h1>Iniciar Sesión</h1>

      <!-- Formulario de Login -->
      <form id="formularioLogin">
        <div class="control">
          <label for="Nombre">Nombre</label>
          <input type="text" name="Nombre" id="Nombre" required>
        </div>
        <div class="control">
          <label for="psw">Contraseña</label>
          <input type="password" name="psw" id="psw" required>
        </div>
        <span><input type="checkbox"> Recuérdame. </span>
        <div class="control">
          <input type="submit" value="Iniciar Sesión">
        </div>
      </form>

      <div class="link">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Link para ir al registro -->
      <div class="link">
        <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
      </div>
    </div>
  </section>

  <script>
    // Código para el formulario de LOGIN
    document.getElementById("formularioLogin").addEventListener("submit", mostrarBienvenida);

    function mostrarBienvenida(e) {
      e.preventDefault(); 

      var nombre = document.getElementById("Nombre").value;
      var password = document.getElementById("psw").value;

      if (nombre.trim() !== "" && password.trim() !== "") {
        alert("¡Bienvenido a Mate.arg, " + nombre + "!");
        
        // Redirige a index.html después del login exitoso
        window.location.href = "index.html"; 
      } else {
        alert("Por favor completa todos los campos.");
      }
    }
  </script>
</body>

</html>
